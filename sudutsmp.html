<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUDUT · Matematika Kelas 7 · Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5EFE0;--paper2:#EDE5D0;--ink:#23262B;--ink2:#5A5E66;--verm:#D9481C;--blue:#274690;--green:#2F6B4A;--red:#B3261E;--line:#C8BCA0;--grid:rgba(39,70,144,.09);--grid2:rgba(39,70,144,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;
background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:140px 140px,140px 140px,28px 28px,28px 28px}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;z-index:50;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.brand{font:600 12px 'IBM Plex Mono';letter-spacing:.14em;white-space:nowrap}
.brand em{font-style:normal;color:var(--verm)}
#crumb{font:500 12px 'IBM Plex Mono';color:var(--ink2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar{width:140px;height:6px;border:1.5px solid var(--ink);flex:none}
#pbarFill{height:100%;width:0;background:var(--verm);transition:width .4s}
#slideNo{font:600 12px 'IBM Plex Mono';white-space:nowrap}
#miniScore{font:600 12px 'IBM Plex Mono';white-space:nowrap}
.tbtn{font:600 11px 'IBM Plex Mono';letter-spacing:.08em;background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding:6px 12px;cursor:pointer}
.tbtn:hover{background:var(--ink);color:var(--paper)}
#deck{position:absolute;inset:52px 0 62px 0}
.slide{position:absolute;inset:0;overflow-y:auto;padding:32px 24px 40px;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .4s,transform .4s}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.wrap{max-width:1100px;margin:0 auto}
#botbar{position:fixed;bottom:0;left:0;right:0;height:62px;background:var(--paper);border-top:1.5px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:50}
#botHint{font:500 11px 'IBM Plex Mono';color:var(--ink2)}
.navbtns{display:flex;gap:10px}
.btn{font:600 13px 'IBM Plex Mono';background:var(--ink);color:var(--paper);border:1.5px solid var(--ink);padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 rgba(35,38,43,.3);transition:.15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(35,38,43,.3)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(35,38,43,.3)}
.btn.acc{background:var(--verm);border-color:var(--verm)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.kicker{font:600 11px 'IBM Plex Mono';letter-spacing:.22em;color:var(--verm);text-transform:uppercase}
h1.big{font:900 clamp(42px,6.5vw,80px)/0.95 'Fraunces';letter-spacing:-.02em}
h2.title{font:800 clamp(24px,3.2vw,38px)/1.05 'Fraunces'}
.mono{font-family:'IBM Plex Mono',monospace}
.rule{height:1.5px;background:var(--ink);margin:14px 0}
.rule.dbl{height:5px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.small{font-size:13px;color:var(--ink2)}
.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:38px;align-items:center;min-height:calc(100% - 10px)}
.cover h1 span{color:var(--verm);font-style:italic}
.cover .sub{font:500 15px/1.65 'IBM Plex Sans';color:var(--ink2);max-width:46ch;margin-top:16px}
.metaRow{display:flex;gap:20px;margin-top:24px;font:600 11px 'IBM Plex Mono';letter-spacing:.1em;flex-wrap:wrap}
.metaRow div{border-left:2.5px solid var(--verm);padding-left:10px}
#protWrap{border:1.5px solid var(--ink);background:rgba(255,255,255,.35);padding:14px;box-shadow:6px 6px 0 rgba(39,70,144,.12)}
#protDeg{font:800 44px 'Fraunces';text-align:center;line-height:1.1}
#protType{font:600 12px 'IBM Plex Mono';color:var(--verm);text-align:center;letter-spacing:.18em}
#protWrap .cap{font:600 10px 'IBM Plex Mono';letter-spacing:.12em;color:var(--ink2);margin-top:8px;text-align:center}
.matGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;align-items:start}
.matGrid .body p{margin:12px 0;line-height:1.7;font-size:15px}
.chapNum{font:900 100px/1 'Fraunces';color:transparent;-webkit-text-stroke:1.6px var(--ink);opacity:.35}
.fact{border:1.5px solid var(--ink);background:rgba(255,255,255,.4);padding:12px 16px;margin:14px 0;box-shadow:4px 4px 0 rgba(39,70,144,.12)}
.fact .f{font:700 22px 'Fraunces';color:var(--verm)}
.exBox{border-left:3px solid var(--blue);background:rgba(39,70,144,.06);padding:12px 16px;margin:14px 0;font-size:14px;line-height:1.65}
.exBox .t{font:700 11px 'IBM Plex Mono';letter-spacing:.16em;color:var(--blue);margin-bottom:6px}
.diagram{border:1.5px solid var(--ink);background:rgba(255,255,255,.45);padding:12px;box-shadow:6px 6px 0 rgba(39,70,144,.12)}
.diagram .cap{font:500 12px/1.55 'IBM Plex Sans';color:var(--ink2);margin-top:8px;text-align:center}
.sliderRow{display:flex;align-items:center;gap:12px;margin-top:10px;font:600 12px 'IBM Plex Mono'}
.sliderRow input[type=range]{flex:1;accent-color:var(--verm)}
.sliderRow .val{min-width:52px;text-align:right;color:var(--verm)}
ul.pts{margin:10px 0 10px 18px;line-height:1.75;font-size:14.5px}
ul.pts li{margin:4px 0}
ul.pts li b{color:var(--verm)}
.exHead{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.chip{width:34px;height:34px;border:1.5px solid var(--ink);background:transparent;font:600 12px 'IBM Plex Mono';color:var(--ink);cursor:pointer}
.chip:hover{background:var(--paper2)}
.chip.cur{outline:2.5px solid var(--verm);outline-offset:1px}
.chip.ok{background:var(--green);border-color:var(--green);color:#fff}
.chip.bad{background:var(--red);border-color:var(--red);color:#fff}
.exGrid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:28px;align-items:start}
.qText{font:600 17px/1.6 'Fraunces';margin-bottom:12px}
.qText b{color:var(--verm)}
.ansRow{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ansRow input{font:700 18px 'IBM Plex Mono';width:120px;padding:9px 12px;border:1.5px solid var(--ink);background:rgba(255,255,255,.6);color:var(--ink)}
.ansRow input:focus{outline:2px solid var(--verm)}
.deg{font:700 20px 'IBM Plex Mono';color:var(--ink2)}
.fb{margin-top:12px;padding:12px 16px;font:600 14px 'IBM Plex Sans';display:none;border-left:4px solid}
.fb.ok{display:block;background:rgba(47,107,74,.1);border-color:var(--green);color:var(--green)}
.fb.bad{display:block;background:rgba(179,38,30,.08);border-color:var(--red);color:var(--red)}
.bahas{display:none;margin-top:12px;border:1.5px dashed var(--ink);background:rgba(255,255,255,.5);padding:14px 16px;font-size:14px;line-height:1.75}
.bahas.show{display:block}
.bahas .t{font:700 11px 'IBM Plex Mono';letter-spacing:.18em;color:var(--blue);margin-bottom:6px}
.qNav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px;flex-wrap:wrap}
.pgOpt{display:block;width:100%;text-align:left;font:500 15px 'IBM Plex Sans';background:rgba(255,255,255,.5);border:1.5px solid var(--ink);padding:12px 16px;margin:8px 0;cursor:pointer;transition:.12s}
.pgOpt .k{font:700 13px 'IBM Plex Mono';color:var(--blue);margin-right:10px}
.pgOpt:hover{background:var(--paper2);transform:translateX(3px)}
.pgOpt.right{background:rgba(47,107,74,.15);border-color:var(--green)}
.pgOpt.wrong{background:rgba(179,38,30,.12);border-color:var(--red)}
.pgOpt:disabled{cursor:default}
.hintBox{border:1.5px dashed var(--blue);color:var(--blue);font:600 12px 'IBM Plex Mono';line-height:1.6;padding:12px 14px}
.scoreGrid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:40px;align-items:start;margin-top:20px}
.ringWrap{text-align:center}
.ringLbl{font:600 12px 'IBM Plex Mono';letter-spacing:.14em;color:var(--ink2);margin-top:8px}
.statLine{display:flex;justify-content:space-between;font:500 13px 'IBM Plex Mono';padding:9px 0;border-bottom:1px solid var(--line)}
.statLine b{color:var(--verm)}
.tRow{margin:13px 0}
.tRow .nm{display:flex;justify-content:space-between;font:600 13px 'IBM Plex Mono';margin-bottom:5px;gap:10px}
.barBg{height:14px;border:1.5px solid var(--ink);background:rgba(255,255,255,.5)}
.bar{height:100%;background:var(--green);transition:width .9s}
.bar.part{background:var(--verm)}
.prio{border:1.5px solid var(--ink);background:rgba(255,255,255,.45);padding:14px 18px;margin-top:18px;box-shadow:4px 4px 0 rgba(39,70,144,.12)}
.prio .t{font:700 11px 'IBM Plex Mono';letter-spacing:.18em;color:var(--verm);margin-bottom:8px}
.prio ol{margin-left:20px;line-height:1.8;font-size:14px}
.sumRow{display:grid;grid-template-columns:110px minmax(0,1fr) 200px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sumRow .ic{width:100%;border:1.5px solid var(--ink);background:rgba(255,255,255,.4)}
.sumRow .nm{font:700 16px 'Fraunces'}
.sumRow .nm span{display:block;font:500 12px 'IBM Plex Sans';color:var(--ink2);margin-top:2px}
.sumRow .fm{font:700 15px 'IBM Plex Mono';color:var(--verm);text-align:right}
.refGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:18px}
.refCard{border:1.5px solid var(--ink);background:rgba(255,255,255,.45);padding:16px;box-shadow:4px 4px 0 rgba(39,70,144,.12)}
.refCard .q{font:700 14px/1.5 'Fraunces';margin-bottom:10px}
.refCard textarea{width:100%;min-height:96px;border:1.5px solid var(--line);background:rgba(255,255,255,.7);font:400 13px 'IBM Plex Sans';padding:10px;resize:vertical;color:var(--ink)}
.refCard textarea:focus{outline:2px solid var(--verm)}
.rateRow{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.rateBtn{width:40px;height:40px;border:1.5px solid var(--ink);background:transparent;font:700 15px 'IBM Plex Mono';cursor:pointer}
.rateBtn.sel{background:var(--verm);border-color:var(--verm);color:#fff}
#toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);font:600 13px 'IBM Plex Mono';padding:12px 22px;opacity:0;pointer-events:none;transition:.35s;z-index:99}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toc{position:fixed;inset:0;background:rgba(35,38,43,.45);z-index:80;display:none;align-items:center;justify-content:center}
#toc.open{display:flex}
#tocPanel{background:var(--paper);border:1.5px solid var(--ink);box-shadow:8px 8px 0 rgba(35,38,43,.4);width:min(620px,92vw);max-height:82vh;overflow:auto;padding:24px 28px}
#tocPanel h3{font:800 22px 'Fraunces';margin-bottom:12px}
.tocG{font:700 10px 'IBM Plex Mono';letter-spacing:.2em;color:var(--verm);margin:12px 0 4px}
.tocItem{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:9px 4px;font:500 14px 'IBM Plex Sans';color:var(--ink);cursor:pointer}
.tocItem:hover{background:var(--paper2)}
.tocItem .n{font:600 12px 'IBM Plex Mono';color:var(--ink2)}
#errbox{display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;background:var(--red);color:#fff;font:600 13px 'IBM Plex Mono';padding:12px 20px;max-width:90vw;border:2px solid #fff}
.lb{font:600 12px 'IBM Plex Mono';fill:#23262B}
.lb.sm{font:600 10px 'IBM Plex Mono'}
.qq{font:700 13px 'IBM Plex Mono';fill:#D9481C}
.qq.sm{font:700 10.5px 'IBM Plex Mono'}
.arc{stroke:#D9481C;stroke-width:2.5;fill:none;transition:stroke-width .15s}
.arc.b{stroke:#274690}
.hit{stroke:#000;stroke-opacity:0;stroke-width:26;fill:none;pointer-events:stroke;cursor:pointer}
.ag:hover .arc,.ag.hot .arc,.ag.pin .arc{stroke-width:6.5}
.sl{stroke:#23262B;stroke-width:2.2;fill:none}
.sl.bl{stroke:#274690}
.sl.vm{stroke:#D9481C}
.sl.th{stroke-width:1.6}
.barc{stroke:#D9481C;stroke-width:5;fill:none}
@media(max-width:900px){.cover,.matGrid,.exGrid,.scoreGrid{grid-template-columns:1fr}#pbar{display:none}.chapNum{font-size:64px}.sumRow{grid-template-columns:90px minmax(0,1fr)}.sumRow .fm{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#23262B"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#274690"/></marker>
<marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#D9481C"/></marker>
</defs>
</svg>

<header id="topbar">
<div class="brand">SUDUT <em>·</em> KELAS 7</div>
<div id="crumb">Beranda</div>
<div id="pbar"><div id="pbarFill"></div></div>
<div id="slideNo" class="mono">01 / 21</div>

<button class="tbtn" id="tocBtn">DAFTAR ISI</button>
</header>

<footer id="botbar">
<div id="botHint">Gunakan tombol ← → pada keyboard</div>

<button class="btn ghost" id="prevBtn">← SEBELUMNYA</button>
<button class="btn" id="nextBtn">LANJUT →</button>
</div>

<div id="toc"><div id="tocPanel"><h3>Daftar Isi</h3><div id="tocList"></div>

<script>
/* ============ PENANGKAP ERROR ============ */
function showErr(m){var b=document.getElementById('errbox');if(b){b.style.display='block';b.textContent='ERROR: '+m;}}
window.onerror=function(msg){showErr(msg);};

function $(s){return document.querySelector(s);}
var SVGNS='http://www.w3.org/2000/svg';
var RAD=Math.PI/180;

/* ============ HELPER SVG ============ */
function el(tag,attrs,parent){var e=document.createElementNS(SVGNS,tag);for(var k in attrs){e.setAttribute(k,attrs[k]);}if(parent){parent.appendChild(e);}return e;}
function txt(parent,x,y,str,cls,anchor){var e=el('text',{x:x,y:y,'class':cls||'lb'},parent);if(anchor){e.setAttribute('text-anchor',anchor);}e.textContent=str;return e;}
function pt(cx,cy,r,d){var a=d*RAD;return[cx+r*Math.cos(a),cy-r*Math.sin(a)];}
function arcPath(cx,cy,r,a1,a2){var p1=pt(cx,cy,r,a1),p2=pt(cx,cy,r,a2);var lg=(a2-a1)>180?1:0;
return 'M '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+' A '+r+' '+r+' 0 '+lg+' 0 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);}
/* lr = radius label opsional; otomatis didorong keluar & mengecil untuk sektor sempit */
function angGroup(svg,cx,cy,a1,a2,r,label,cls,lr){
  if(a2-a1<3){return null;}
  var span=a2-a1;
  var g=el('g',{'class':'ag'},svg);
  el('path',{d:arcPath(cx,cy,r,a1,a2),'class':(cls==='b'?'arc b':'arc')},g);
  el('path',{d:arcPath(cx,cy,r,a1,a2),'class':'hit'},g);
  var lrDef=(span<30)?(r+26):((span<50)?(r+18):(r+15));
  var m=pt(cx,cy,(lr||lrDef),(a1+a2)/2);
  var lc=(cls==='q')?'qq':'lb';
  if(span<38){lc+=' sm';}
  txt(g,m[0],m[1]+4,label,lc);
  g.addEventListener('pointerenter',function(){g.classList.add('hot');});
  g.addEventListener('pointerleave',function(){g.classList.remove('hot');});
  g.addEventListener('click',function(){g.classList.toggle('pin');});
  return g;
}
function polyAng(svg,V,P1,P2,r,label,cls){
  var d1=Math.atan2(-(P1[1]-V[1]),P1[0]-V[0])/RAD;
  var d2=Math.atan2(-(P2[1]-V[1]),P2[0]-V[0])/RAD;
  var del=d2-d1;
  while(del>180){del-=360;} while(del<-180){del+=360;}
  var a1=d1,a2=d1+del;
  if(del<0){a1=d2;a2=d2-del;}
  return angGroup(svg,V[0],V[1],a1,a2,r,label,cls);
}
function lineSeg(p,x1,y1,x2,y2,cls,m1,m2){var a={x1:x1,y1:y1,x2:x2,y2:y2,'class':cls||'sl'};
if(m1){a['marker-start']='url(#'+m1+')';}if(m2){a['marker-end']='url(#'+m2+')';}el('line',a,p);}
function dotAt(p,x,y){el('circle',{cx:x,cy:y,r:3,fill:'#23262B'},p);}
function vb(svg,w,h){svg.setAttribute('viewBox','0 0 '+w+' '+h);}
function linkGroups(arcs,ga,gb){
  function on(list){return function(){list.forEach(function(n){if(arcs[n]){arcs[n].classList.add('hot');}});};}
  function off(list){return function(){list.forEach(function(n){if(arcs[n]){arcs[n].classList.remove('hot');}});};}
  ga.forEach(function(n){if(arcs[n]){arcs[n].addEventListener('pointerenter',on(ga));arcs[n].addEventListener('pointerleave',off(ga));}});
  gb.forEach(function(n){if(arcs[n]){arcs[n].addEventListener('pointerenter',on(gb));arcs[n].addEventListener('pointerleave',off(gb));}});
}

/* ============ FIGUR-FIGUR ============ */
/* garis lurus: sektor kiri (ray..180) = labL, sektor kanan (0..ray) = labR.
   Label sektor sempit didorong lebih jauh agar tidak menabrak sinar. */
function figLP(svg,ray,labL,labR){
  vb(svg,420,240);
  var O=[150,190];
  lineSeg(svg,25,190,395,190,'sl','ma','ma');
  var tip=pt(O[0],O[1],118,ray);
  lineSeg(svg,O[0],O[1],tip[0],tip[1],'sl',null,'ma'); /* panah hanya di ujung, bukan di titik O */
  dotAt(svg,O[0],O[1]);
  var spanL=180-ray,spanR=ray;
  var lrL=(spanL<45)?78:((spanL<70)?62:48);
  var lrR=(spanR<45)?78:((spanR<70)?62:48);
  angGroup(svg,O[0],O[1],ray,180,34,labL,'',lrL);
  angGroup(svg,O[0],O[1],0,ray,34,labR,'',lrR);
  txt(svg,O[0]+16,O[1]+20,'O','lb','start');
}
function figCP(svg,ray,labLo,labUp){
  vb(svg,420,240);var O=[150,190];
  lineSeg(svg,O[0],O[1],O[0],58,'sl',null,'ma');
  lineSeg(svg,O[0],O[1],340,O[1],'sl',null,'ma');
  var t=pt(O[0],O[1],105,ray);
  lineSeg(svg,O[0],O[1],t[0],t[1],'sl',null,'ma');
  dotAt(svg,O[0],O[1]);
  var p1=pt(O[0],O[1],14,0),p2=pt(O[0],O[1],14,90),pc=pt(O[0],O[1],20,45);
  el('path',{d:'M '+p1[0]+' '+p1[1]+' L '+pc[0]+' '+pc[1]+' L '+p2[0]+' '+p2[1],'class':'sl th bl'},svg);
  angGroup(svg,O[0],O[1],0,ray,28,labLo,'',(ray<45?66:(ray<70?52:44)));
  angGroup(svg,O[0],O[1],ray,90,28,labUp,'',((90-ray)<45?66:44));
}
function figFT(svg,a,b,labs){
  vb(svg,420,240);var O=[205,118];
  var angs=[a,b,360-a-b],acc=0;
  for(var i=0;i<3;i++){
    var t=pt(O[0],O[1],88,acc);
    lineSeg(svg,O[0],O[1],t[0],t[1],'sl',null,'ma'); /* tanpa panah di pusat O */
    dotAt(svg,O[0],O[1]);
    angGroup(svg,O[0],O[1],acc,acc+angs[i],26,labs[i]);
    acc+=angs[i];
  }

function figX(svg,al,known,target,demo){
  vb(svg,420,260);
  var y1=75,y2=195,px=150,arcs={},n;
  lineSeg(svg,20,y1,400,y1,'sl bl','mb','mb');
  lineSeg(svg,20,y2,400,y2,'sl bl','mb','mb');
  var s=Math.sin(al*RAD),c=Math.cos(al*RAD),d=(y2-y1)/s,Q=px+d*c;
  lineSeg(svg,px-55*c,y1-55*s,Q+45*c,y2+45*s,'sl vm','mv','mv');
  dotAt(svg,px,y1);dotAt(svg,Q,y2);
  var st=[al,0,180,180+al],en=[180,al,180+al,360];
  for(n=1;n<=8;n++){
    var i=(n-1)%4,ox,oy;
    if(n<=4){ox=px;oy=y1;}else{ox=Q;oy=y2;}
    var label,cls='';
    if(demo){label=n+' = '+angVal(n,al)+'°';if(angVal(n,al)===al){cls='b';}}
    else if(n===known){label=n+' = '+angVal(n,al)+'°';}
    else if(n===target){label=n+' = ?';cls='q';}
    else{label=''+n;}
    arcs[n]=angGroup(svg,ox,oy,st[i],en[i],(en[i]-st[i])>90?34:24,label,cls);
  }
  if(demo){linkGroups(arcs,[2,3,6,7],[1,4,5,8]);}
  txt(svg,px-10,y1-8,'P','lb','end');
  txt(svg,Q+10,y2-8,'Q','lb','start');
  return arcs;
}

function drawQ(ti){
  var qi=EXC[ti],q=QS[ti][qi],ch=$('#chips'+ti),i;
  ch.innerHTML='';
  for(i=0;i<20;i++){
    (function(idx){
      var b=document.createElement('button');b.className='chip';b.textContent=(idx+1);
      var a=ANSWERS[key(ti,idx)];
      if(a){b.classList.add(a.s==='benar'?'ok':'bad');}
      if(idx===qi){b.classList.add('cur');}
      b.onclick=function(){EXC[ti]=idx;drawQ(ti);};
      ch.appendChild(b);
    })(i);
  }
  var st=topicStat(ti);
  document.getElementById('exStat'+ti).textContent='terjawab '+st.done+'/20 · benar '+st.b+' · salah '+st.w;
  document.getElementById('qt'+ti).innerHTML='<span class="mono" style="color:var(--verm)">Soal '+(qi+1)+'.</span> '+q.txt;
  /* DIPERBAIKI: kosongkan SVG dulu agar gambar soal tidak menumpuk */
  var exs=document.getElementById('exSvg'+ti);
  exs.innerHTML='';
  var arcs=q.draw(exs);
  var ar=$('#ansRow'+ti);
  ar.innerHTML='<input type="number" id="ansIn" placeholder="…" step="any" inputmode="decimal"> <span class="deg">°</span>'+
  '<button class="btn" id="cekBtn">CEK JAWABAN</button><button class="btn ghost" id="bhBtn">LIHAT PEMBAHASAN</button>';
  var done=ANSWERS[key(ti,qi)];
  var cek=document.getElementById('cekBtn'),inp=document.getElementById('ansIn');
  cek.onclick=function(){
    var v=parseFloat(inp.value);
    if(isNaN(v)){toast('Isi dulu jawabanmu ya.');return;}
    var ok=Math.abs(v-q.ans)<0.01;
    record(ti,qi,ok);
    if(q.hl&&arcs){q.hl.forEach(function(n){if(arcs[n]){arcs[n].classList.add('pin');}});}
    cek.disabled=true;inp.disabled=true;
    showFb(ti,ok,v);
    var c=ch.querySelector('.cur');
    if(c){c.classList.remove('ok','bad');c.classList.add(ok?'ok':'bad');}
    var s2=topicStat(ti);
    document.getElementById('exStat'+ti).textContent='terjawab '+s2.done+'/20 · benar '+s2.b+' · salah '+s2.w;
  };
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){cek.click();}});
  document.getElementById('bhBtn').onclick=function(){
    var bh=$('#bh'+ti);bh.innerHTML='<div class="t">PEMBAHASAN</div>'+q.exp;bh.classList.add('show');};
  if(done){cek.disabled=true;inp.disabled=true;showFb(ti,done.s==='benar',null);}
  else{$('#bh'+ti).classList.remove('show');$('#fb'+ti).className='fb';}
}
function showFb(ti,ok,v){
  var fb=$('#fb'+ti);
  fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=ok?'<b>Benar!</b> Jawabanmu tepat.':'<b>Belum tepat.</b>'+(v!=null?(' Jawabanmu '+v+'°.'):'')+' Periksa sifat sudut yang berlaku — pembahasan tersedia.';
}

function drawStory(){
  var i=STCUR,s=STORIES[i],ch=$('#stChips'),k;
  ch.innerHTML='';
  for(k=0;k<20;k++){
    (function(idx){
      var b=document.createElement('button');b.className='chip';b.textContent=(idx+1);

      if(a){b.classList.add(a.s==='benar'?'ok':'bad');}

      ch.appendChild(b);

      b.disabled=true;

      $('#stBh').innerHTML='<div class="t">PEMBAHASAN</div>'+s.b;$('#stBh').classList.add('show');
      var f=$('#stFb');f.className='fb '+(done.s==='benar'?'ok':'bad');
      f.innerHTML=(done.s==='benar')?'<b>Benar!</b> Visualisasimu tepat.':'<b>Belum tepat.</b> Baca pembahasannya, lalu bayangkan ulang sketsanya.';
    }else{
      b.onclick=function(){
        var ok=(k2===s.c);
        ANSWERS[key(7,i)]={s:(ok?'benar':'salah'),p:k2};save();updMini();

function renderScore(){
  var elc=$('#scoreBody');if(!elc){return;}
  var TB=0,TD=0,rows=[],ti;
  for(ti=0;ti<8;ti++){
    var s=topicStat(ti);TB+=s.b;TD+=s.done;
    rows.push({name:(ti<7?MATNAME[ti]:'Soal Cerita'),focus:(ti<7?FOCUS[ti]:'menerjemahkan cerita menjadi sketsa sudut sebelum menghitung.'),b:s.b,w:s.w,done:s.done});
  }
  var pct=TD?Math.round(TB/TD*100):0,C=2*Math.PI*66;
  var prio=rows.filter(function(r){return r.w>0;}).sort(function(a,b){return b.w-a.w;}).slice(0,3);
  var h='<div class="scoreGrid"><div class="ringWrap">'+
  '<svg width="200" height="200" viewBox="0 0 160 160">'+
  '<circle cx="80" cy="80" r="66" fill="none" stroke="#C8BCA0" stroke-width="10"/>'+
  '<circle id="ringC" cx="80" cy="80" r="66" fill="none" stroke="'+(pct>=70?'#2F6B4A':(pct>=40?'#D9481C':'#B3261E'))+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 80 80)"/>'+
  '<text x="80" y="76" text-anchor="middle" style="font:800 34px Fraunces" fill="#23262B">'+(TD?pct+'%':'—')+'</text>'+
  '<text x="80" y="98" text-anchor="middle" style="font:600 10px IBM Plex Mono" fill="#5A5E66">'+TB+' BENAR DARI '+TD+'</text></svg>'+
  '<div class="ringLbl">DARI TOTAL 160 SOAL</div>'+
  '<div class="statLine" style="margin-top:14px"><span>Total benar</span><b>'+TB+'</b></div>'+
  '<div class="statLine"><span>Total salah</span><b style="color:var(--red)">'+(TD-TB)+'</b></div>'+
  '<div class="statLine"><span>Belum dikerjakan</span><b>'+(160-TD)+'</b></div></div><div>';
  rows.forEach(function(r){
    var p=r.done?Math.round(r.b/r.done*100):0;
    h+='<div class="tRow"><div class="nm"><span>'+r.name+'</span><span style="color:'+(r.done?(p>=70?'var(--green)':'var(--verm)'):'var(--ink2)')+'">'+(r.done?(r.b+' benar / '+r.done+' dikerjakan'):'belum dikerjakan')+'</span></div>'+
    '<div class="barBg"><div class="bar'+(r.done&&p<70?' part':'')+'" style="width:'+(r.done?p:0)+'%"></div></div></div>';
  });
  h+='<div class="prio"><div class="t">ANALISIS — PRIORITAS PEMBAHASAN</div>';
  if(TD===0){
    h+='<p style="line-height:1.7;font-size:14px">Kamu belum mengerjakan soal mana pun. Mulailah dari latihan pertama — analisis ini otomatis menunjukkan bagian yang perlu dibahas ulang.</p>';
  }else if(prio.length){
    h+='<ol>';
    prio.forEach(function(r){h+='<li><b>'+r.name+'</b> — '+r.w+' jawaban salah. Fokus: '+r.focus+'</li>';});
    h+='</ol><p class="small" style="margin-top:10px">Saran: buka kembali slide materinya, lalu ulangi latihannya.</p>';
  }else{
    h+='<p style="line-height:1.7;font-size:14px">Luar biasa — dari soal yang sudah dikerjakan, <b>tidak ada yang salah</b>. Pertahankan!</p>';
  }
  h+='</div></div></div>';
  elc.innerHTML=h;
  requestAnimationFrame(function(){
    var rc=document.getElementById('ringC');
    if(rc){rc.style.transition='stroke-dashoffset 1.2s ease';rc.style.strokeDashoffset=(C*(1-pct/100));}
  });
}

/* ============ NAVIGASI ============ */
function go(n){
  CUR=Math.max(0,Math.min(SLIDES.length-1,n));
  SLIDES.forEach(function(s,i){s.sec.classList.toggle('on',i===CUR);});
  $('#crumb').textContent=SLIDES[CUR].title;
  $('#slideNo').textContent=('0'+(CUR+1)).slice(-2)+' / '+SLIDES.length;
  $('#pbarFill').style.width=(((CUR+1)/SLIDES.length)*100)+'%';
  $('#prevBtn').disabled=(CUR===0);
  $('#nextBtn').textContent=(CUR===SLIDES.length-1)?'SELESAI ✓':'LANJUT →';
  if(SLIDES[CUR].onEnter){try{SLIDES[CUR].onEnter();}catch(e){showErr(e.message);}}
  SLIDES[CUR].sec.scrollTop=0;
  var t=SLIDES[CUR].title;
  $('#botHint').textContent=((t.indexOf('Latihan')===0||t==='Soal Cerita')?'Kerjakan tiap soal, lalu tekan CEK JAWABAN':'Gunakan tombol ← → pada keyboard');
}
 $('#prevBtn').onclick=function(){go(CUR-1);};
 $('#nextBtn').onclick=function(){go(CUR+1);};
document.addEventListener('keydown',function(e){
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'){return;}
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(CUR+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(CUR-1);}
});
document.addEventListener('click',function(e){
  var g=e.target;
  while(g&&g!==document){
    if(g.getAttribute&&g.getAttribute('data-go')){go(parseInt(g.getAttribute('data-go'),10));return;}
    g=g.parentNode;
  }
});
 $('#tocBtn').onclick=function(){buildToc();$('#toc').classList.add('open');};
function buildToc(){
  var l=$('#tocList');l.innerHTML='';
  function g1(t){var d=document.createElement('div');d.className='tocG';d.textContent=t;l.appendChild(d);}
  function mk(t,i){
    var b=document.createElement('button');b.className='tocItem';
    b.innerHTML='<span>'+t+'</span><span class="n">'+('0'+(i+1)).slice(-2)+'</span>';
    b.onclick=function(){$('#toc').classList.remove('open');go(i);};
    l.appendChild(b);
  }
  g1('MATERI & LATIHAN');
  mk('Peta Belajar',1);
  for(var i=0;i<7;i++){mk(MATNAME[i],2+i*2);mk('Latihan: '+MATNAME[i],3+i*2);}
  g1('PENUTUP');
  mk('Soal Cerita',16);mk('Skor & Analisis',17);mk('Kesimpulan',18);mk('Refleksi',19);mk('Penutup',20);
}
 $('#tocClose').onclick=function(){$('#toc').classList.remove('open');};
 $('#toc').addEventListener('click',function(e){if(e.target.id==='toc'){$('#toc').classList.remove('open');}});

/* ============ MULAI ============ */
try{updMini();go(0);}catch(e){showErr(e.message);}
